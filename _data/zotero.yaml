- id: schaeferJesusImTalmud2017
  abstract: >-
    English summary: This is a thorough investigation of the passages about
    Jesus in the rabbinic literature, mainly in the Babylonian Talmud. In his
    lucid and accessible book, Peter Schafer examines how the rabbis read and
    used the New Testament to assert Judaism's superiority over Christianity.
    The Talmudic texts focus on the virgin birth of Jesus, his behavior as a bad
    and frivolous disciple, his teachings, the healing capacities Jesus and his
    disciples possessed, the execution of Jesus and his disciples, and finally
    his punishment forever in hell. The center of this critique of Jesus and his
    fate was Babylonia under Sassanian rule, quite in contrast to Palestinian
    Judaism, which was increasingly threatened by the dominant power of
    Christianity. German description: In seinem neuesten Buch [Jesus im Talmud]
    hat Schafer sich nicht nur als ein grossartiger Erforscher antiker und
    mittelalterlicher judischer Texte erwiesen - das wurde bereits zur Genuge
    demonstriert -, sondern auch als ein talentierter Autor, aus dessen Handen
    der Text fliesst wie das Wasser, mit dem die Rabbinen die Torah verglichen
    haben.Galit Hasan-Rokem in Jewish Quarterly Review 99 (2009), S. 114Schafers
    faszinierende Studie demonstriert meisterhaft, dass der babylonische Talmud
    auf christliche Behauptungen uber Jesus von Nazareth antwortet, [...] dass
    die Uberlieferungen der babylonischen Rabbinen nicht die verqueren
    Phantasien bornierter Rabbinen [...] sind, sondern faszinierende
    Rohdiamanten, kurze und oft brutale Meisterstucke, die historische Lektionen
    von entscheidender Bedeutung mitzuteilen haben.Richard Kalmin in Jewish
    Quarterly Review 99 (2009), S. 112Nicht zuletzt mit der Klarheit in der
    Argumentation lost das Buch [a] den Anspruch Schafers, ein
    allgemeinverstandliches Werk vorzulegen, uberzeugend ein.S.O. in Herder
    Korrespondenz 62 (2008), S. 269Zudem ist sein Werk - gerade in einer Zeit
    aufkommenden religiosen Fundamentalismus - auch fur interessierte Laien mit
    Gewinn zu lesen, bietet es doch Einblicke in die Auseinandersetzungen von
    Spatantike und Fruhmittelalter, die historisch einzuordnen Aufgabe unserer
    Zeit ist, damit ein angemessenes Nebeneinander der Religionen erreicht
    werden kann.Joachim Jeska in Biblische Zeitschrift 52 (2008), S. 297-298
