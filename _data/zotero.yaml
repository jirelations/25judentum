- id: alkierJudenChristenHeiden2018
  abstract: >-
    The triad of Jews, Gentiles and Christians seems clearly arranged in the
    religious
     world of the Roman Empire. However, a closer look shows that this is too simple a
     model in that it neither does justice to the diverse descriptions of these groups
     or those of others, nor to their respective concepts of identity or the varying mechanisms
     of inclusions and exclusions. This volume illustrates this by way of interdisciplinary
     individual studies on Asia Minor, but also through conceptional considerations. In
     summary, the editors offer new terminology suggestions
