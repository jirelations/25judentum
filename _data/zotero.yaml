- id: goodmanJewsJudaismSecond2004
  abstract: >-
    For all Jews in this period, in both diaspora and homeland, the Jerusalem
    Temple was the central religious institution. The wide dispersal of Jews
    prevented many from regular participation in Temple worship, but no
    religious Jew seem to have ignored the significance of the sacrificial and
    other offerings in Jerusalem. The second pillar of common Judaism was the
    Torah. It was during these centuries that the biblical text took a form
    resembling that of the present day and acquired something close to its later
    authority. Most of the debate about the relation of Jews to the surrounding
    culture has concentrated on the Hellenization of Judaism. The motivation of
    Christian scholars for investigating the relationship of Judaism and
    Hellenism has naturally been very different and more concerned with the
    origins of ideas found in the early Church.
