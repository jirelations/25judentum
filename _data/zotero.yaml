    Palestinian sources, arguing that the rabbis' proud and self-confident
    countermessage to that of the evangelists was possible only in the unique
    historical setting of Persian Babylonia, in a Jewish community that lived in
    relative freedom. The same could not be said of Roman and Byzantine
    Palestine, where the Christians aggressively consolidated their political
    power and the Jews therefore suffered. A departure from past scholarship,
    which has played down the stories as unreliable distortions of the
    historical Jesus, "Jesus in the Talmud" posits a much more deliberate agenda
    behind these narratives.
